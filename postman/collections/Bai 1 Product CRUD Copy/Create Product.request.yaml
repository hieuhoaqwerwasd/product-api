$kind: http-request
url: "{{baseUrl}}/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"pid": {{pid}}, "pname": "Postman X", "price": 100, "quantity": 10}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("HTTP 201", () => pm.response.to.have.status(201));
    language: text/javascript
  - type: beforeRequest
    code: pm.collectionVariables.set("pid", String(Math.floor(Date.now()/1000)));
    language: text/javascript
order: 2000
