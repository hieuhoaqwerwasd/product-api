$kind: http-request
url: "{{baseUrl}}/products/{{pid}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"quantity": -1}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("HTTP 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
