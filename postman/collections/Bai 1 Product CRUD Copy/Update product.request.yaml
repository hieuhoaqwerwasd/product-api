$kind: http-request
url: "{{baseUrl}}/products/{{pid}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"quantity": 8}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
