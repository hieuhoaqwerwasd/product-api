name: Integration CI and Docker Hub CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm test
      - name: Prepare non-secret CI configuration
        run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: npm run test:integration
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
  publish:
    needs: integration
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/product-api:latest
  deploy-local:
    needs: publish
    if: vars.ENABLE_LOCAL_CD == 'true' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, product-api-local]
    environment: local-demo
    steps:
      - uses: actions/checkout@v4
      - name: Pull tested commit and deploy
        shell: powershell
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/product-api
          IMAGE_TAG: ${{ github.sha }}
          MONGO_VOLUME: bt-p1_mongo_data
        run: |
          if (!(Test-Path .env)) { Copy-Item .env.example .env }
          docker compose -f docker-compose-prod.yaml pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker compose -f docker-compose-prod.yaml up -d --wait --wait-timeout 180
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BASE_URL = 'http://localhost:3001'
          node scripts/smoke.js
          exit $LASTEXITCODE
